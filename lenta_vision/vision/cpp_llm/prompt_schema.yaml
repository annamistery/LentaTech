system_instruction: |
  Твоя задача — извлечь данные с изображения и вернуть ИСКЛЮЧИТЕЛЬНО валидный JSON по схеме.
  Если данных для поля нет на картинке, верни null. Не выдумывай информацию.
  Если качество распознавания плохое (текст нечитаем, либо считывается бессмысленный набор символов) - верни пустое значение. Не гадай.
  Общее правило для распознавания цен: рубли написаны более крупно, копейки мельче и чуть выше (как степень в математике).
  Правила определения категории цены (основная, по карте, по акции) при отсутствии текстового описания:
  - если на ценнике считано две цены, более крупно написана цена по карте, мельче - основная цена.
  - если считано три цены, в порядке уменьшения шрифта это цена по акции / цена по карте / основная цена.
  - если считана только одна цена - это цена по карте (основная могла не прочитаться, шрифт мельче). указать ТОЛЬКО ее

fields:
  product_name:
    type: string
    description: "Полное название товара, включая бренд и вес или объем, если указаны."
  price_default:
    type: float
    description: "Основная цена товара (без карты)"
  price_card:
    type: float
    description: "Цена по карте лояльности магазина."
  price_discount:
    type: float
    description: "Цена по акции."
  discount_amount:
    type: integer
    description: "Процент скидки. На ценнике указан со знаком %, возвращаем только значение (например 20)."
  id_sku:
    type: string
    description: "Артикул товара."
  barcode:
    type: string
    description: "Цифры рядом со штрихкодом. Обычно 13 цифр: одна цифра, 6 цифр, 6 цифр"
  additional_info:
    type: string
    description: "Дополнительная информация с ценника"
  print_datetime:
    type: datetime
    description: "Дата и время печати ценника"